[package]
name = "base"
version = "0.1.0"
edition = "2021"

[dependencies]
base-types = { path = "../base-types" }
wgpu = "0.20"
winit = "0.30"
cudarc = { version = "0.12", default-features = false, features = ["std", "driver", "cublas", "cuda-12050"] }
pollster = "0.3"
tracing = { version = "0.1", features = ["release_max_level_off"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
lmdb-zero = "0.4"
liblmdb-sys = "0.2"
cranelift-codegen = "0.123"
cranelift-jit = "0.123"
cranelift-module = "0.123"
cranelift-native = "0.123"

[dev-dependencies]
# For the corpus test only: it reads what the build generated.
lean-artifacts = { path = "../lean-artifacts" }
tempfile = "3"
serde_json = "1"

[lib]
name = "base"
path = "src/lib.rs"
# `rlib` for the Rust dependents; `cdylib` for the hosts that reach the same
# `Base` through `src/capi.rs`. A shared object rather than a static library
# because it resolves cudarc, wgpu, winit and lmdb itself: a non-Rust host
# linking a `staticlib` would have to name every transitive system library on
# its own link line.
crate-type = ["rlib", "cdylib"]
