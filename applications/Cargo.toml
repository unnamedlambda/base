[package]
name = "applications"
version = "0.1.0"
edition = "2021"
# One crate for every example. Each keeps its own directory -- source, tests and
# whatever data or Python belongs with it -- and is declared here as a target,
# so adding an example is a directory and a few lines rather than a new crate.

[dependencies]
base = { path = "../base" }
# Every artifact, as `lean_artifacts::NAME`.
lean-artifacts = { path = "../lean" }
warp-check = { path = "../warp-check" }
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
# Producers and consumers on a work-stealing pool (`shared-sum/tests/rayon.rs`).
rayon = "=1.11.0"
# A generic CBOR decoder, for the host side of `self-describing`.
ciborium = "0.2"

[[bin]]
name = "apps"
path = "main.rs"
test = false

[[test]]
name = "apps"
path = "tests.rs"
