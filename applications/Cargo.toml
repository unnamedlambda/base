[package]
name = "applications"
version = "0.1.0"
edition = "2021"
# One crate for every example. Each keeps its own directory -- source, tests and
# whatever data or Python belongs with it -- and is declared here as a target,
# so adding an example is a directory and a few lines rather than a new crate.

[dependencies]
base = { path = "../base" }
base-types = { path = "../base-types" }
# Ordering only: cargo runs its build script, and so `lake`, before this crate
# compiles and reads the artifacts with `include_bytes!`.
lean-artifacts = { path = "../lean-artifacts" }
# For `artifact!`; the build script below uses it to locate the generated tree.
build-support = { path = "../build-support" }
warp-check = { path = "../warp-check" }
bincode = "1"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }
arrow-array = { version = "54", default-features = false }

[build-dependencies]
build-support = { path = "../build-support" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "backward-wide"
path = "backward-wide/src/main.rs"

[[bin]]
name = "blackhole"
path = "blackhole/src/main.rs"

