[package]
name = "system-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Built by `run.sh` with -C target-cpu=native into its own target directory.

[dependencies]
base = { path = "../../base" }
lean-artifacts = { path = "../../lean" }
hashbrown = "0.15"
foldhash = "0.1"
lmdb-zero = "0.4"
liblmdb-sys = "0.2"
memchr = "2"

[[bin]]
name = "system-bench"
path = "src/main.rs"
